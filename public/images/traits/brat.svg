<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow -->
  <circle cx="400" cy="330" r="220" fill="#fb923c" opacity="0.22" filter="url(#glow)" />

  <!-- Outer Card Frame -->
  <rect x="40" y="40" width="720" height="720" rx="36" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.4" />

  <!-- Top Pill Tag -->
  <rect x="250" y="80" width="300" height="48" rx="24" fill="#0f172a" fill-opacity="0.85" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="400" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#fb923c" text-anchor="middle">
    🐾 BDSM 동물 성향 테스트
  </text>

  <!-- Emoji Avatar Circle Frame -->
  <circle cx="400" cy="310" r="130" fill="url(#circleGrad)" stroke="#fb923c" stroke-width="5" />

  <!-- Big Animal Emoji -->
  <text x="400" y="355" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" font-size="120" text-anchor="middle">
    🦝
  </text>

  <!-- Animal Title Label -->
  <text x="400" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    말썽꾸러기 라쿤
  </text>

  <!-- Trait Subtitle -->
  <text x="400" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
    &quot;길들여지고 싶은 장난꾸러기 반항아&quot;
  </text>

  <!-- CTA Footer Box -->
  <rect x="200" y="640" width="400" height="52" rx="26" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-width="1.5" />
  <text x="400" y="673" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="bold" fill="#fb923c" text-anchor="middle">
    나와의 성향 궁합 지도 확인하기 ✨
  </text>
</svg>